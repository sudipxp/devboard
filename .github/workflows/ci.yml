# goal of this workflow is to code build and test with lint for frontend and backend nd push t Dockerhub

name: CI

on: 
  push:
    branches: [advanced]

jobs:   

  frontend:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install npm
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint

      - name: Run Tests
        run: npm run test


