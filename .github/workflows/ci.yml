# goal of this workflow is to code build and test with lint for frontend and backend nd push t Dockerhub

name: CI

on: 
  push:
    branches: [advanced]

jobs:   

  frontend:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
        # Version or version range of node to use
          node-version: '20'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install npm
        run: npm ci
        working-directory: frontend

      - name: Run linter
        run: npm run lint
        working-directory: frontend

      - name: Run code Tests
        run: npm run test
        working-directory: frontend

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}     

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend          
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest


  backend:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout the code
        uses: actions/checkout@v7
      
      - name: Checkout the code
        uses: actions/setup-go@v6         
        with:
          # Version or version range of Go to use
          go-version: '1.23'
          
          # Path to go.mod, go.work, .go-version, or .tool-versions file          
          go-version-file: 'go.mod'

          # Set this option if you want the action to check for the latest available version
          # Default: false
          check-latest: false

          # Path to dependency files for caching
          cache-dependency-path: 'go.sum'

      - name: Run lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      - name: Run tests
        run: go test
        working-directory: backend

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}     

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend          
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest
