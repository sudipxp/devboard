name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight (UTC)
  workflow_dispatch: # Allows you to manually trigger the sync with a button click

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to update your repo's code
    steps:
      - name: Sync upstream changes
        run: gh repo sync $REPOSITORY -b $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }} # This resolves to sudipxp/devboard
          BRANCH_NAME: master
